name: CI

# Lint + validate every experiment, then actually apply them against a real
# Floci container — proving the whole lab works, at zero cost and no AWS account.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (fmt + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: shellcheck scripts
        run: shellcheck -S error scripts/tf scripts/*.sh

  validate:
    name: Validate experiments
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: terraform validate (all experiments)
        run: |
          set -euo pipefail
          for d in experiments/*/; do
            name=$(basename "$d")
            [ "$name" = "_shared" ] && continue
            echo "::group::validate $name"
            terraform -chdir="$d" init -backend=false -input=false -no-color
            terraform -chdir="$d" validate -no-color
            echo "::endgroup::"
          done

  integration:
    name: Apply against Floci
    runs-on: ubuntu-latest
    needs: validate
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: Start Floci
        run: |
          docker run -d --name floci \
            -p 4566:4566 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            floci/floci:latest

      - name: Wait for Floci to be healthy
        run: |
          for i in $(seq 1 45); do
            if curl -fs http://localhost:4566/_localstack/health >/dev/null; then
              echo "Floci is healthy"; exit 0
            fi
            sleep 2
          done
          echo "Floci did not become healthy in time"; docker logs floci; exit 1

      - name: Apply + destroy every experiment
        run: |
          set -euo pipefail
          for d in experiments/*/; do
            name=$(basename "$d")
            [ "$name" = "_shared" ] && continue
            echo "::group::$name"
            terraform -chdir="$d" init -input=false -no-color
            terraform -chdir="$d" apply -auto-approve -input=false -no-color
            terraform -chdir="$d" destroy -auto-approve -input=false -no-color
            echo "::endgroup::"
          done

      - name: Floci logs (on failure)
        if: failure()
        run: docker logs floci

      - name: Stop Floci
        if: always()
        run: docker rm -f floci || true
